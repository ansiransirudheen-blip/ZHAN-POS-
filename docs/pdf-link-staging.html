<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZAHN PDF Link Staging Test</title><style>body{font:16px system-ui;background:#faf9f6;color:#29241c;max-width:620px;margin:30px auto;padding:18px}section{background:white;border:1px solid #dfcaa2;border-radius:12px;padding:20px}h1{color:#a47b37}input,button,textarea{display:block;width:100%;box-sizing:border-box;padding:12px;margin:10px 0;font:inherit}button{background:#bd9550;color:white;border:0;border-radius:7px}a{word-break:break-all}small{color:#665}textarea{height:140px}</style><section><h1>ZAHN — PDF Link Staging</h1><p>Private test only. This page does not change the live invoice app.</p><label>Staging account email<input id="email" type="email" autocomplete="username"></label><label>Password<input id="password" type="password" autocomplete="current-password"></label><button id="login">Sign in to staging</button><p id="status"></p><div id="uploader" hidden><label>Test invoice PDF<input id="file" type="file" accept="application/pdf"></label><label>Customer WhatsApp number<input id="phone" type="tel" placeholder="9665XXXXXXXX"></label><button id="upload">Upload PDF and create 7-day view link</button><textarea id="message" readonly placeholder="WhatsApp message will appear here"></textarea><a id="view" target="_blank" rel="noopener"></a><button id="send" hidden>Open WhatsApp with PDF link</button></div><small>Links expire after 7 days. Anyone holding the signed link can view the PDF until expiry. Do not use real customer information for this staging test.</small></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const db=window.supabase.createClient('https://nzbhvsbgpavvuwxpjrun.supabase.co','sb_publishable_xKTwDW8nchBMnbCrvssBaA_Am8UAp7d');
const $=id=>document.getElementById(id),say=s=>$('status').textContent=s;let currentUser=null;
$('login').onclick=async()=>{say('Signing in...');const {data,error}=await db.auth.signInWithPassword({email:$('email').value.trim(),password:$('password').value});if(error){say(error.message);return}currentUser=data.user;$('uploader').hidden=false;say('Signed in to staging. Use a test PDF only.')};
$('upload').onclick=async()=>{if(!currentUser)return say('Sign in first');const file=$('file').files[0];if(!file||file.type!=='application/pdf'||file.size>5*1024*1024)return say('Choose a PDF under 5 MB');say('Uploading...');const path=currentUser.id+'/'+crypto.randomUUID()+'.pdf';const up=await db.storage.from('zahn-invoice-pdfs').upload(path,file,{contentType:'application/pdf',upsert:false});if(up.error)return say('Upload failed: '+up.error.message);const link=await db.storage.from('zahn-invoice-pdfs').createSignedUrl(path,604800,{download:false});if(link.error)return say('Link creation failed: '+link.error.message);const url=link.data.signedUrl;$('view').href=url;$('view').textContent='Open PDF invoice (7-day link)';$('message').value='ZAHN LUXURY PERFUMES\\nYour invoice PDF: '+url+'\\nThank you for shopping with ZAHN!';$('send').hidden=false;$('send').onclick=()=>{const phone=$('phone').value.replace(/\\D/g,'');window.open('https://wa.me/'+phone+'?text='+encodeURIComponent($('message').value),'_blank')};say('Test PDF uploaded. View link generated.')};
</script></html>

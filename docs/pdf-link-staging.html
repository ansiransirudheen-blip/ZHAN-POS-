<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ZAHN PDF Link Staging Test</title><style>body{font:16px system-ui;background:#faf9f6;color:#29241c;max-width:620px;margin:30px auto;padding:18px}section{background:white;border:1px solid #dfcaa2;border-radius:12px;padding:20px}h1{color:#a47b37}input,button,textarea{display:block;width:100%;box-sizing:border-box;padding:12px;margin:10px 0;font:inherit}button{background:#bd9550;color:white;border:0;border-radius:7px}a{word-break:break-all}small{color:#665}textarea{height:140px}</style><section><h1>ZAHN — PDF Link Staging</h1><p>Private test only. This page does not change the live invoice app.</p><label>Staging Admin Email<input id="email" type="email" autocomplete="email" value="ansirnadheer.aa@gmail.com"></label><button id="login">Send login email</button><label>Email OTP code (if provided)<input id="otp" inputmode="numeric" autocomplete="one-time-code" placeholder="Enter code from email"></label><button id="verify">Verify email code</button><p id="status"></p><div id="uploader" hidden><label>Test invoice PDF<input id="file" type="file" accept="application/pdf"></label><label>Customer WhatsApp number<input id="phone" type="tel" placeholder="9665XXXXXXXX"></label><button id="upload">Upload PDF and create 7-day view link</button><textarea id="message" readonly placeholder="WhatsApp message will appear here"></textarea><a id="view" target="_blank" rel="noopener"></a><button id="send" hidden>Open WhatsApp with PDF link</button></div><small>Links expire after 7 days. Anyone holding the signed link can view the PDF until expiry. Do not use real customer information for this staging test.</small></section><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const db=window.supabase.createClient('https://nzbhvsbgpavvuwxpjrun.supabase.co','sb_publishable_xKTwDW8nchBMnbCrvssBaA_Am8UAp7d');
const $=id=>document.getElementById(id),say=s=>$('status').textContent=s;let currentUser=null;
async function loggedIn(user){currentUser=user;$('uploader').hidden=false;say('Signed in to staging. Use a test PDF only.')}
$('login').onclick=async()=>{const email=$('email').value.trim();if(!email)return say('Enter email');say('Sending login email...');const {error}=await db.auth.signInWithOtp({email,options:{shouldCreateUser:true,emailRedirectTo:location.origin+location.pathname}});say(error?'Email failed: '+error.message:'Check your email for a login link or OTP code. Also check Spam.');};
$('verify').onclick=async()=>{const email=$('email').value.trim(),token=$('otp').value.trim();if(!token)return say('Enter the OTP from email');const {data,error}=await db.auth.verifyOtp({email,token,type:'email'});if(error)return say(error.message);await loggedIn(data.user)};
db.auth.getUser().then(({data})=>{if(data?.user)loggedIn(data.user)});
db.auth.onAuthStateChange((_event,session)=>{if(session?.user)loggedIn(session.user)});
$('upload').onclick=async()=>{if(!currentUser)return say('Sign in first');const file=$('file').files[0];if(!file||file.type!=='application/pdf'||file.size>5*1024*1024)return say('Choose a PDF under 5 MB');say('Uploading...');const path=currentUser.id+'/'+crypto.randomUUID()+'.pdf';const up=await db.storage.from('zahn-invoice-pdfs').upload(path,file,{contentType:'application/pdf',upsert:false});if(up.error)return say('Upload failed: '+up.error.message);const link=await db.storage.from('zahn-invoice-pdfs').createSignedUrl(path,604800,{download:false});if(link.error)return say('Link creation failed: '+link.error.message);const url=link.data.signedUrl;$('view').href=url;$('view').textContent='Open PDF invoice (7-day link)';$('message').value='ZAHN LUXURY PERFUMES\\nYour invoice PDF: '+url+'\\nThank you for shopping with ZAHN!';$('send').hidden=false;$('send').onclick=()=>{const phone=$('phone').value.replace(/\\D/g,'');window.open('https://wa.me/'+phone+'?text='+encodeURIComponent($('message').value),'_blank')};say('Test PDF uploaded. View link generated.')};
</script></html>

name: Build check
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Run PIN unit tests
        run: npm test
      - name: Build frontend without production credentials
        run: npm run build
      - name: Install browser test runner
        run: npm install --no-save --no-audit --no-fund @playwright/test
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Browser smoke test (no production credentials)
        env:
          VITE_ENABLE_LIVE_BILLING: 'false'
          VITE_ENABLE_LIVE_PURCHASES: 'false'
        run: npx playwright test
